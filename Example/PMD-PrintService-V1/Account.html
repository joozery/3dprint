<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>บัญชีของฉัน · Print My Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --brand-purple: #8848a8;
    --brand-purple-deep: #683888;
    --brand-green: #28c868;
    --bg: oklch(0.985 0.004 310);
    --bg-2: oklch(0.97 0.006 310);
    --card: #fff;
    --chip: oklch(0.94 0.008 310);
    --line: oklch(0.88 0.012 310);
    --line-soft: oklch(0.92 0.008 310);
    --ink: oklch(0.22 0.02 310);
    --muted: oklch(0.52 0.02 310);
    --muted2: oklch(0.4 0.02 310);
    --accent: var(--brand-purple);
    --accent-deep: var(--brand-purple-deep);
    --positive: var(--brand-green);
    --warn: oklch(0.72 0.16 65);
    --danger: oklch(0.6 0.21 25);
    --sans: 'Sarabun', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg: oklch(0.17 0.018 310);
    --bg-2: oklch(0.2 0.02 310);
    --card: oklch(0.22 0.02 310);
    --chip: oklch(0.27 0.022 310);
    --line: oklch(0.32 0.022 310);
    --line-soft: oklch(0.28 0.02 310);
    --ink: oklch(0.96 0.005 310);
    --muted: oklch(0.65 0.018 310);
    --muted2: oklch(0.78 0.015 310);
    --accent: oklch(0.72 0.16 310);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }
  input:focus { border-color: var(--accent) !important; }

  .btn-primary {
    background: var(--accent); color: #fff;
    border: 1px solid var(--accent);
    padding: 8px 14px; border-radius: 4px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: opacity .15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 4px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; gap: 3px;
    transition: background .15s;
  }
  .btn-ghost:hover { background: var(--chip); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/i18n.jsx"></script>
<script type="text/babel" src="components/account-i18n.jsx"></script>
<script type="text/babel" src="components/account-data.jsx"></script>
<script type="text/babel" src="components/account-shell.jsx"></script>
<script type="text/babel" src="components/account-profile.jsx"></script>
<script type="text/babel" src="components/account-commerce.jsx"></script>
<script type="text/babel" src="components/account-workspace.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "layout": "full",
  "state": "business",
  "section": "profile"
}/*EDITMODE-END*/;

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('pmd-account') || '{}'); } catch { return {}; } })();
  const [tweaks, setTweaks] = useState({ ...TWEAK_DEFAULTS, ...saved });
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const [lang, setLang] = useState('th');
  const [active, setActive] = useState(tweaks.section || 'profile');

  const [customer, setCustomer] = useState(SAMPLE_CUSTOMER);
  const [addresses, setAddresses] = useState(SAMPLE_ADDRESSES);
  const [models, setModels] = useState(SAMPLE_MODELS);
  const [orders] = useState(SAMPLE_ORDERS);
  const [quotes] = useState(SAMPLE_QUOTES);
  const [payments, setPayments] = useState(SAMPLE_PAYMENTS);
  const [team, setTeam] = useState(SAMPLE_TEAM);
  const [notifPrefs, setNotifPrefs] = useState(SAMPLE_NOTIFICATIONS);

  // apply state tweak
  useEffect(() => {
    if (tweaks.state === 'empty') {
      setAddresses([]); setModels([]);
    } else if (tweaks.state === 'individual') {
      setCustomer({ ...SAMPLE_CUSTOMER, type: 'individual' });
    } else if (tweaks.state === 'business') {
      setCustomer(SAMPLE_CUSTOMER); setAddresses(SAMPLE_ADDRESSES); setModels(SAMPLE_MODELS);
    } else if (tweaks.state === 'multi') {
      setAddresses([...SAMPLE_ADDRESSES, {
        id: 'a3', label: { th: 'โรงงานระยอง', en: 'Rayong Plant', zh: '罗勇工厂', ja: 'ラヨーン工場' },
        line1: { th: '99/9 นิคมอุตสาหกรรมอีสเทิร์นซีบอร์ด', en: '99/9 Eastern Seaboard Industrial Estate', zh: '东方海滨工业区', ja: 'イースタンシーボード' },
        subDistrict: { th: 'ปลวกแดง', en: 'Pluak Daeng', zh: '', ja: '' },
        district: { th: 'ปลวกแดง', en: 'Pluak Daeng', zh: '', ja: '' },
        province: { th: 'ระยอง', en: 'Rayong', zh: '罗勇', ja: 'ラヨーン' },
        postal: '21140', country: 'TH',
        receiver: { th: 'ฝ่ายรับสินค้า', en: 'Receiving', zh: '', ja: '' },
        receiverPhone: '+66 38 955 400', isDefault: false,
      }]);
    }
  }, [tweaks.state]);

  // sync section tweak
  useEffect(() => {
    if (tweaks.section !== active) updateTweak('section', active);
  }, [active]);

  const updateTweak = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    localStorage.setItem('pmd-account', JSON.stringify(next));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
  };

  // Edit mode protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      else if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const counters = useMemo(() => ({
    addresses: addresses.length, models: models.length,
    orders: orders.length, quotes: quotes.filter(q => !q.expired).length,
    payments: payments.length, team: team.filter(t => t.status === 'active').length,
  }), [addresses, models, orders, quotes, payments, team]);

  const sectionKey = tweaks.layout === 'wide' ? active : active;
  const content = (() => {
    switch (active) {
      case 'profile': return <ProfileSection customer={customer} setCustomer={setCustomer}/>;
      case 'addresses': return <AddressesSection addresses={addresses} setAddresses={setAddresses}/>;
      case 'billing': return <BillingSection customer={customer} addresses={addresses}/>;
      case 'models': return <ModelsSection models={models} setModels={setModels}/>;
      case 'orders': return <OrdersSection orders={orders}/>;
      case 'quotes': return <QuotesSection quotes={quotes}/>;
      case 'payments': return <PaymentsSection payments={payments} setPayments={setPayments}/>;
      case 'notifications': return <NotificationsSection prefs={notifPrefs} setPrefs={setNotifPrefs}/>;
      case 'team': return <TeamSection team={team} setTeam={setTeam}/>;
      default: return null;
    }
  })();

  const collapsed = tweaks.layout === 'compact';
  const sidebarW = collapsed ? '56px' : '240px';
  const maxContentW = tweaks.layout === 'wide' ? 'none' : '960px';

  return (
    <LangContext.Provider value={{ lang, setLang, t: I18N[lang] || I18N.th }}>
    <div data-theme={tweaks.theme} style={{
      height: '100vh',
      display: 'grid',
      gridTemplateAreas: '"header header" "sidebar main"',
      gridTemplateColumns: `${sidebarW} 1fr`,
      gridTemplateRows: '52px 1fr',
      background: 'var(--bg)', color: 'var(--ink)',
    }}>
      <AccountHeader/>
      <AccountSidebar active={active} setActive={setActive} collapsed={collapsed} counters={counters}/>
      <main style={{ gridArea: 'main', overflow: 'auto', padding: '28px 32px 60px' }}>
        <div style={{ maxWidth: maxContentW, margin: '0 auto' }}>
          {content}
        </div>
      </main>
      {tweaksVisible && <TweaksPanel tweaks={tweaks} updateTweak={updateTweak} onClose={() => setTweaksVisible(false)}/>}
    </div>
    </LangContext.Provider>
  );
}

function TweaksPanel({ tweaks, updateTweak, onClose }) {
  const TWEAK_LABEL = { display: 'block', fontFamily: 'var(--mono)', fontSize: 10,
    letterSpacing: 1.2, textTransform: 'uppercase', color: 'var(--muted)', marginBottom: 6 };
  const TWEAK_OPT = (on) => ({
    padding: '5px 10px', fontSize: 11, fontFamily: 'var(--mono)',
    background: on ? 'var(--ink)' : 'var(--bg)', color: on ? 'var(--bg)' : 'var(--ink)',
    border: '1px solid var(--line)', borderRadius: 3, cursor: 'pointer', flex: 1, textAlign: 'center',
  });
  return (
    <div style={{ position: 'fixed', bottom: 20, right: 20, width: 280,
      background: 'var(--card)', border: '1px solid var(--line)', borderRadius: 8,
      boxShadow: '0 10px 30px rgba(0,0,0,0.12)', zIndex: 1000, overflow: 'hidden' }}>
      <div style={{ padding: '12px 14px', borderBottom: '1px solid var(--line)',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ fontFamily: 'var(--mono)', fontSize: 11, letterSpacing: 1.5,
          textTransform: 'uppercase', fontWeight: 600 }}>Tweaks</div>
        <button onClick={onClose} style={{ background: 'transparent', border: 'none',
          cursor: 'pointer', color: 'var(--muted)' }}><IconX size={14}/></button>
      </div>
      <div style={{ padding: 14, display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div>
          <div style={TWEAK_LABEL}>Theme</div>
          <div style={{ display: 'flex', gap: 4 }}>
            {['light', 'dark'].map(v => (
              <button key={v} onClick={() => updateTweak('theme', v)} style={TWEAK_OPT(tweaks.theme === v)}>{v}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={TWEAK_LABEL}>Layout</div>
          <div style={{ display: 'flex', gap: 4 }}>
            {['full', 'compact', 'wide'].map(v => (
              <button key={v} onClick={() => updateTweak('layout', v)} style={TWEAK_OPT(tweaks.layout === v)}>{v}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={TWEAK_LABEL}>Account state</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 4 }}>
            {['empty', 'individual', 'business', 'multi'].map(v => (
              <button key={v} onClick={() => updateTweak('state', v)} style={TWEAK_OPT(tweaks.state === v)}>{v}</button>
            ))}
          </div>
        </div>
        <div>
          <div style={TWEAK_LABEL}>Jump to section</div>
          <select value={tweaks.section} onChange={e => updateTweak('section', e.target.value)}
            style={{ width: '100%', padding: '6px 8px', fontSize: 12, fontFamily: 'var(--mono)',
              background: 'var(--bg)', border: '1px solid var(--line)', borderRadius: 3 }}>
            {NAV_SECTIONS.flatMap(s => s.items).map(it => (
              <option key={it.id} value={it.id}>{it.id}</option>
            ))}
          </select>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
